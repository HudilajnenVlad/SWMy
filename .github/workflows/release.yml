name: Release

# Builds the compendium packs and publishes swordworld25.zip + system.json as a GitHub release.
# Foundry installs from the manifest URL:
#   https://github.com/HudilajnenVlad/SWMy/releases/latest/download/system.json
#
# Runs when a version tag (v0.1.0, …) is pushed, or manually from the Actions tab.
# The release tag is always v<version from swordworld25/system.json>.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build release
        run: node tools/release.mjs --repo "${{ github.repository }}"

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./swordworld25/system.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match system.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sword World 2.5 v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/swordworld25.zip
            dist/system.json
